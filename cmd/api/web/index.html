<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloud189 签到</title>
<style>
body{font-family:system-ui,sans-serif;max-width:800px;margin:24px auto;padding:0 16px}
.card{border:1px solid #ddd;border-radius:8px;padding:16px;margin:12px 0}
input,button{padding:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid #ddd;padding:6px;font-size:13px}
.hidden{display:none}
</style>
</head>
<body>
<h2>天翼云盘签到（个人+家庭）</h2>

<div class="card" id="loginCard">
  <h3>登录（任一签到账号即可）</h3>
  <input id="username" placeholder="手机号">
  <input id="password" type="password" placeholder="密码">
  <button onclick="login()">登录</button>
</div>

<div class="card hidden" id="mainCard">
  <h3>账号管理</h3>
  <div id="accounts"></div>
  <h4>新增/全量保存</h4>
  <input id="newUser" placeholder="手机号">
  <input id="newPass" type="password" placeholder="密码">
  <button onclick="addAccount()">加入列表</button>
  <button onclick="saveAccounts()">保存全部</button>
  <h3>签到</h3>
  <button onclick="runCheckin()">立即签到全部</button>
  <pre id="checkinResult"></pre>
  <h3>日志</h3>
  <button onclick="loadLogs()">刷新日志</button>
  <table><thead><tr><th>时间</th><th>账号</th><th>个人</th><th>家庭</th><th>错误</th></tr></thead>
  <tbody id="logs"></tbody></table>
</div>

<script src="app.js"></script>
</body>
</html>
